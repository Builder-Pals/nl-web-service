services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///data/cache.db
      RELEASE_TAG: ${RELEASE_TAG:-dev}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - app_data:/data
    networks:
      internal:
        aliases:
          - native-web-service
      edge:
        aliases:
          - native-web-service

networks:
  internal:
  edge:
    name: ${PROXY_NETWORK:-web}
    external: true

volumes:
  app_data:
